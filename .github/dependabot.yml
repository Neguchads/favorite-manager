# Atualizações automáticas de dependências.
# Minor e patch chegam juntas num PR só por ecossistema; major vem separada para revisão.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      github_actions-minor-patch:
        update-types:
          - minor
          - patch
